
name: Firestore candidate emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'security-review/**'
      - 'scripts/test-maternity-security-rules.cjs'
      - '.github/workflows/firestore-emulator-qa.yml'

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Candidate structural checks
        run: node security-review/check-candidate.cjs

      - name: Install Firebase test dependencies
        run: npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing

      - name: Run real Firestore emulator authorization tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-no-project --config security-review/firebase.emulator.json 'node scripts/test-maternity-security-rules.cjs'
