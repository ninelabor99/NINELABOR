name: NINE source verification
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  offline-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/run-offline-suite.cjs
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:build
      - run: npm run report:inventory

      - name: Check phase 125-132 source revisions
        run: npm run check:phase125-132
